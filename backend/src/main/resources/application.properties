# Server Configuration
server.port=8080

# Supabase (PostgreSQL) Datasource Configuration
# Credentials are provided via environment variables (never committed to Git)
# Example Supabase:
# SUPABASE_DB_URL=jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres
# SUPABASE_DB_USERNAME=postgres
# SUPABASE_DB_PASSWORD=your_password
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:monolithdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SUPABASE_DB_USERNAME:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# LegacySupply Anti-Corruption Layer Configuration
legacysupply.base-url=https://legacysupply.onrender.com/api/v1
legacysupply.client-id=${LS_CLIENT_ID:21-3360-213}
legacysupply.api-key=${LS_API_KEY:}

# Tiangge Marketplace Integration Configuration
tiangge.base-url=${TIANGGE_BASE_URL:https://legacysupply.onrender.com/tiangge/v1}
tiangge.instance-id=${TIANGGE_INSTANCE_ID:${LS_CLIENT_ID:21-3360-213}}
tiangge.api-key=${TIANGGE_API_KEY:${LS_API_KEY:}}


