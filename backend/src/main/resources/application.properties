# Server Configuration
server.port=8080

# Supabase (PostgreSQL) Datasource Configuration
# Credentials are provided via environment variables (never committed to Git)
# Example Supabase:
# SUPABASE_DB_URL=jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres
# SUPABASE_DB_USERNAME=postgres
# SUPABASE_DB_PASSWORD=your_password
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:monolithdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SUPABASE_DB_USERNAME:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
